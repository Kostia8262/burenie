<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="stylesheet" href="../site/assets/css/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px;
    font-family: "Onest", system-ui, sans-serif;
    background: #0d2b3a;
    color: #fff;
    display: flex;
    overflow: hidden;
  }
  .txt {
    width: 690px;
    padding: 64px 0 60px 68px;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 52px; height: 52px; }
  .brand b { font-size: 27px; font-weight: 700; letter-spacing: -.03em; }
  .brand span { display: block; font-size: 15px; color: #9bb6c4; font-weight: 400; letter-spacing: 0; margin-top: 2px; }
  h1 {
    font-size: 60px;
    line-height: 1.04;
    letter-spacing: -.04em;
    font-weight: 700;
    margin-top: 52px;
    max-width: 14ch;
  }
  h1 em { font-style: normal; color: #4bb4dc; }
  .facts { display: flex; gap: 34px; margin-top: 34px; }
  .facts div b { display: block; font-size: 25px; font-weight: 700; letter-spacing: -.03em; }
  .facts div span { display: block; font-size: 15px; color: #9bb6c4; margin-top: 4px; }
  .tel {
    margin-top: auto;
    display: flex; align-items: center; gap: 13px;
    font-size: 31px; font-weight: 700; letter-spacing: -.03em;
  }
  .tel i {
    width: 46px; height: 46px; border-radius: 12px; background: #ef7b1c;
    display: grid; place-items: center;
  }
  .tel i svg { width: 24px; height: 24px; }
  .photo { position: absolute; inset: 0 0 0 560px; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 52% 42%; }
  .photo::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(95deg, #0d2b3a 0%, #0d2b3a 26%, rgba(13,43,58,.45) 62%, rgba(13,43,58,.18) 100%);
  }
  .strata { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; display: flex; z-index: 3; }
  .strata i { height: 100%; }
</style>
</head>
<body>
  <div class="photo">
    <img src="../site/assets/img/photo/mgbu-1.jpg" alt="">
  </div>

  <div class="txt">
    <div class="brand">
      <svg viewBox="0 0 40 40">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2e9bc4"/><stop offset="1" stop-color="#12527e"/>
        </linearGradient></defs>
        <path fill="url(#g)" d="M20 2.5c6.4 7.7 11.5 14.2 11.5 20.3C31.5 30.3 26.3 36 20 36S8.5 30.3 8.5 22.8C8.5 16.7 13.6 10.2 20 2.5z"/>
        <rect x="18.4" y="11" width="3.2" height="14.5" rx=".4" fill="#fff"/>
        <path d="M15.9 25.5h8.2L20 32z" fill="#ef7b1c"/>
      </svg>
      <b>СОС Бурение<span>Донецк · ДНР</span></b>
    </div>

    <h1>Скважина на воду <em>под ключ</em></h1>

    <div class="facts">
      <div><b>1–2 дня</b><span>на скважину</span></div>
      <div><b>Бесплатно</b><span>выезд и расчёт</span></div>
      <div><b>Паспорт</b><span>и гарантия</span></div>
    </div>

    <div class="tel">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.3 3.8h3l1.4 3.6-1.9 1.4a11 11 0 0 0 5.4 5.4l1.4-1.9 3.6 1.4v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.3 6 2 2 0 0 1 6.3 3.8z"/>
      </svg></i>
      +7 (949) 405-68-46
    </div>
  </div>

  <div class="strata">
    <i style="flex:2;background:#6c5943"></i>
    <i style="flex:10;background:#927b57"></i>
    <i style="flex:10;background:#d8c28c"></i>
    <i style="flex:23;background:#9dbfc4"></i>
    <i style="flex:25;background:#8d9a92"></i>
    <i style="flex:40;background:#79b8ce"></i>
  </div>
</body>
</html>
